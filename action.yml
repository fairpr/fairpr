name: 'FairPR'
description: 'Stop AI-slop pull requests without punishing honest contributors. Checks PRs against your policy and explains what to fix.'
author: 'FairPR'
branding:
  icon: 'check-circle'
  color: 'green'
inputs:
  github-token:
    description: 'Token used to read the PR and post the comment/labels.'
    required: false
    default: ${{ github.token }}
  config-path:
    description: 'Path to the policy file, read from the base branch.'
    required: false
    default: '.github/fairpr.yml'
  mode:
    description: 'Override the policy mode: label, comment or dry-run.'
    required: false
    default: ''
  fail-on-quarantine:
    description: 'Fail the workflow run when a PR is placed on hold.'
    required: false
    default: 'false'
outputs:
  verdict:
    description: 'verified, needs-info, quarantine or skipped'
runs:
  using: 'node20'
  main: 'dist/index.js'
